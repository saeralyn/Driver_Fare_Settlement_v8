<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代驾服务结算</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.05);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .sub { margin: 0; color: var(--muted); font-size: .96rem; }
    h2 { margin: 0 0 14px; font-size: 1.15rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row { margin-bottom: 12px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: .92rem; font-weight: 700; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .route-grid {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      gap: 10px;
      align-items: end;
    }
    .arrow-box {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--muted);
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    .toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }
    .toggle label {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    .actions, .export-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #eef2ff; color: #3730a3; }
    .btn-export { background: #ecfeff; color: #0f766e; }
    .hidden { display: none; }
    .summary { display: grid; gap: 10px; }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
    }
    .summary-item:last-child { border-bottom: none; }
    .muted { color: var(--muted); }
    .total { font-size: 1.3rem; font-weight: 800; color: var(--success); }
    .save-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }
    .save-title {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 800;
    }
    .hint { color: var(--muted); font-size: .88rem; margin-top: 8px; }
    .placeholder { color: var(--muted); padding: 8px 0; }
    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      margin: 6px 0 18px;
    }
    @media print {
      body { background: white; }
      .no-print, .footer-note { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>代驾服务结算</h1>
      <p class="sub">计算结算明细程序</p>
    </div>

    <div class="card no-print">
      <h2>基本资料</h2>

      <div class="grid">
        <div class="row">
          <label for="serviceDate">日期</label>
          <input id="serviceDate" type="date" />
        </div>

        <div class="row">
          <label for="serviceTime">时间</label>
          <input id="serviceTime" type="time" />
        </div>

        <div class="row">
          <label for="customerName">顾客</label>
          <input id="customerName" type="text" placeholder="请输入顾客姓名" />
        </div>

        <div class="row">
          <label for="driverCode">安排司机代号</label>
          <input id="driverCode" type="text" placeholder="例如 D01" />
        </div>
      </div>

      <div class="row">
        <label>出发点和目的地</label>
        <div class="route-grid">
          <div><input id="pickupPoint" type="text" placeholder="出发点" /></div>
          <div class="arrow-box">→</div>
          <div><input id="dropoffPoint" type="text" placeholder="目的地" /></div>
        </div>
      </div>

      <h2 style="margin-top: 6px;">收费输入</h2>

      <div class="grid">
        <div class="row">
          <label for="baseFare">起步价（RM）</label>
          <input id="baseFare" class="num-input" type="number" min="0" step="0.01" value="30" />
        </div>

        <div class="row">
          <label for="distanceKm">总公里数（km）</label>
          <input id="distanceKm" class="num-input" type="number" min="0" step="0.01" value="0" />
        </div>

        <div class="row">
          <label for="ratePerKm">每公里收费（RM）</label>
          <input id="ratePerKm" class="num-input" type="number" min="0" step="0.01" value="4" />
        </div>
      </div>

      <div class="toggle">
        <input id="hasDelay" type="checkbox" />
        <label for="hasDelay">有 Delay</label>
      </div>

      <div id="delaySection" class="grid hidden">
        <div class="row">
          <label for="delayRateField">Delay 每分钟收费（RM）</label>
          <input id="delayRateField" class="num-input" type="number" min="0" step="0.01" value="1" />
        </div>

        <div class="row">
          <label for="delayMinutesField">Delay 分钟数</label>
          <input id="delayMinutesField" class="num-input" type="number" min="0" step="0.01" value="0" />
        </div>
      </div>

      <div class="toggle">
        <input id="hasDiscount" type="checkbox" />
        <label for="hasDiscount">有优惠</label>
      </div>

      <div id="discountSection" class="grid hidden">
        <div class="row">
          <label for="discountType">优惠类型</label>
          <select id="discountType">
            <option value="fixed">固定金额</option>
            <option value="percent">百分比</option>
          </select>
        </div>

        <div class="row">
          <label for="discountValue">优惠数值</label>
          <input id="discountValue" class="num-input" type="number" min="0" step="0.01" value="0" />
        </div>
      </div>

      <div class="actions">
        <button id="calcBtn" class="btn-primary" type="button">计算</button>
        <button id="resetBtn" class="btn-secondary" type="button">重置</button>
      </div>
    </div>

    <div class="card" id="receiptCard">
      <h2>结算明细</h2>
      <div id="result" class="summary">
        <div class="placeholder">尚未计算。请填写资料后按“计算”。</div>
      </div>

      <div class="save-box no-print">
        <div class="save-title">保存选项</div>
        <div class="export-actions">
          <button id="csvBtn" class="btn-export" type="button">导出 CSV</button>
          <button id="pdfBtn" class="btn-export" type="button">导出 PDF</button>
        </div>
        <div class="hint">未先计算时不能导出；PDF 会调用浏览器的打印/另存为 PDF。</div>
      </div>
    </div>

    <div class="footer-note no-print">程序设计 © NYX_2026</div>
  </div>

  <script>
    const serviceDate = document.getElementById("serviceDate");
    const serviceTime = document.getElementById("serviceTime");
    const customerName = document.getElementById("customerName");
    const driverCode = document.getElementById("driverCode");
    const pickupPoint = document.getElementById("pickupPoint");
    const dropoffPoint = document.getElementById("dropoffPoint");
    const baseFare = document.getElementById("baseFare");
    const distanceKm = document.getElementById("distanceKm");
    const ratePerKm = document.getElementById("ratePerKm");
    const hasDelay = document.getElementById("hasDelay");
    const delaySection = document.getElementById("delaySection");
    const delayRateField = document.getElementById("delayRateField");
    const delayMinutesField = document.getElementById("delayMinutesField");
    const hasDiscount = document.getElementById("hasDiscount");
    const discountSection = document.getElementById("discountSection");
    const discountType = document.getElementById("discountType");
    const discountValue = document.getElementById("discountValue");
    const result = document.getElementById("result");
    const calcBtn = document.getElementById("calcBtn");
    const resetBtn = document.getElementById("resetBtn");
    const csvBtn = document.getElementById("csvBtn");
    const pdfBtn = document.getElementById("pdfBtn");

    let hasCalculated = false;
    let lastCalculatedData = null;

    function bindSelectAll(input) {
      input.addEventListener("focus", function () {
        if (typeof this.select === "function") this.select();
      });
      input.addEventListener("pointerdown", function () {
        setTimeout(() => { if (typeof this.select === "function") this.select(); }, 0);
      });
      input.addEventListener("blur", function () {
        if (this.classList.contains("num-input") && (this.value === "" || this.value === "-")) {
          if (this.id === "baseFare") this.value = "30";
          else if (this.id === "ratePerKm") this.value = "4";
          else if (this.id === "delayRateField") this.value = "1";
          else this.value = "0";
        }
      });
    }

    document.querySelectorAll("input, select").forEach(bindSelectAll);

    hasDelay.addEventListener("change", () => {
      delaySection.classList.toggle("hidden", !hasDelay.checked);
    });

    hasDiscount.addEventListener("change", () => {
      discountSection.classList.toggle("hidden", !hasDiscount.checked);
    });

    const formOrder = [
      "serviceDate","serviceTime","customerName","driverCode","pickupPoint","dropoffPoint",
      "baseFare","distanceKm","ratePerKm","delayRateField","delayMinutesField","discountType","discountValue"
    ];

    formOrder.forEach((id, index) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          let nextIndex = index + 1;
          while (nextIndex < formOrder.length) {
            const nextEl = document.getElementById(formOrder[nextIndex]);
            if (!nextEl) { nextIndex++; continue; }
            if ((nextEl.id === "delayRateField" || nextEl.id === "delayMinutesField") && !hasDelay.checked) { nextIndex++; continue; }
            if ((nextEl.id === "discountType" || nextEl.id === "discountValue") && !hasDiscount.checked) { nextIndex++; continue; }
            nextEl.focus();
            if (typeof nextEl.select === "function") nextEl.select();
            return;
          }
          calculateFare();
        }
      });
    });

    function getNum(el) {
      const value = parseFloat(el.value.trim());
      return isNaN(value) || value < 0 ? 0 : value;
    }
    function getText(el) { return el.value.trim(); }
    function money(n) { return `RM ${n.toFixed(2)}`; }

    function formatTime12h(time24) {
      if (!time24) return "-";
      const parts = time24.split(":");
      let hour = parseInt(parts[0], 10);
      const minute = parts[1] || "00";
      if (isNaN(hour)) return time24;
      const period = hour >= 12 ? "PM" : "AM";
      if (hour === 0) hour = 12;
      else if (hour > 12) hour = hour - 12;
      return `${hour}:${minute} ${period}`;
    }

    function getFareData() {
      const base = getNum(baseFare);
      const km = getNum(distanceKm);
      const rate = getNum(ratePerKm);
      const distanceCharge = km * rate;

      let dRate = 0, dMin = 0, dCharge = 0;
      if (hasDelay.checked) {
        dRate = getNum(delayRateField);
        dMin = getNum(delayMinutesField);
        dCharge = dRate * dMin;
      }

      const subtotal = base + distanceCharge + dCharge;

      let discountAmount = 0, discountTypeText = "无", discountValueText = "0";
      if (hasDiscount.checked) {
        const value = getNum(discountValue);
        if (discountType.value === "fixed") {
          discountAmount = value;
          discountTypeText = "固定金额";
          discountValueText = money(value);
        } else {
          discountAmount = subtotal * (value / 100);
          discountTypeText = "百分比";
          discountValueText = `${value.toFixed(2)}%`;
        }
      }

      if (discountAmount > subtotal) discountAmount = subtotal;

      return {
        serviceDate: getText(serviceDate),
        serviceTime: formatTime12h(getText(serviceTime)),
        customerName: getText(customerName),
        driverCode: getText(driverCode),
        routeText: [getText(pickupPoint), getText(dropoffPoint)].filter(Boolean).join(" → "),
        baseFare: base,
        distanceKm: km,
        ratePerKm: rate,
        distanceCharge,
        hasDelay: hasDelay.checked,
        delayRate: dRate,
        delayMinutes: dMin,
        delayCharge: dCharge,
        subtotal,
        hasDiscount: hasDiscount.checked,
        discountTypeText,
        discountValueText,
        discountAmount,
        total: subtotal - discountAmount
      };
    }

    function calculateFare() {
      const d = getFareData();
      const delayText = d.hasDelay
        ? `${d.delayMinutes.toFixed(2)} 分钟 × ${money(d.delayRate)} = ${money(d.delayCharge)}`
        : money(0);
      const discountText = d.hasDiscount
        ? `- ${money(d.discountAmount)}（${d.discountTypeText}：${d.discountValueText}）`
        : `-RM 0.00`;

      result.innerHTML = `
        <div class="summary-item"><span class="muted">日期</span><span>${d.serviceDate || "-"}</span></div>
        <div class="summary-item"><span class="muted">时间</span><span>${d.serviceTime || "-"}</span></div>
        <div class="summary-item"><span class="muted">顾客</span><span>${d.customerName || "-"}</span></div>
        <div class="summary-item"><span class="muted">安排司机代号</span><span>${d.driverCode || "-"}</span></div>
        <div class="summary-item"><span class="muted">出发点和目的地</span><span>${d.routeText || "-"}</span></div>
        <div class="summary-item"><span class="muted">起步价</span><span>${money(d.baseFare)}</span></div>
        <div class="summary-item"><span class="muted">公里收费</span><span>${d.distanceKm.toFixed(2)} km × ${money(d.ratePerKm)} = ${money(d.distanceCharge)}</span></div>
        <div class="summary-item"><span class="muted">Delay 收费</span><span>${delayText}</span></div>
        <div class="summary-item"><span class="muted">小计</span><span>${money(d.subtotal)}</span></div>
        <div class="summary-item"><span class="muted">优惠</span><span>${discountText}</span></div>
        <div class="summary-item"><span>最终总费用</span><span class="total">${money(d.total)}</span></div>
      `;
      hasCalculated = true;
      lastCalculatedData = d;
    }

    function resetForm() {
      serviceDate.value = "";
      serviceTime.value = "";
      customerName.value = "";
      driverCode.value = "";
      pickupPoint.value = "";
      dropoffPoint.value = "";
      baseFare.value = "30";
      distanceKm.value = "0";
      ratePerKm.value = "4";
      delayRateField.value = "1";
      delayMinutesField.value = "0";
      discountValue.value = "0";
      discountType.value = "fixed";
      hasDelay.checked = false;
      hasDiscount.checked = false;
      delaySection.classList.add("hidden");
      discountSection.classList.add("hidden");
      result.innerHTML = `<div class="placeholder">尚未计算。请填写资料后按“计算”。</div>`;
      hasCalculated = false;
      lastCalculatedData = null;
    }

    function ensureCalculated() {
      if (!hasCalculated || !lastCalculatedData) {
        alert("还没有计算，暂时不能导出。请先按“计算”。");
        return false;
      }
      return true;
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function exportCSV() {
      if (!ensureCalculated()) return;
      const d = lastCalculatedData;
      const rows = [
        ["项目", "内容"],
        ["日期", d.serviceDate],
        ["时间", d.serviceTime],
        ["顾客", d.customerName],
        ["安排司机代号", d.driverCode],
        ["出发点和目的地", d.routeText],
        ["起步价", money(d.baseFare)],
        ["公里收费", `${d.distanceKm.toFixed(2)} km × ${money(d.ratePerKm)} = ${money(d.distanceCharge)}`],
        ["Delay 收费", d.hasDelay ? `${d.delayMinutes.toFixed(2)} 分钟 × ${money(d.delayRate)} = ${money(d.delayCharge)}` : "RM 0.00"],
        ["小计", money(d.subtotal)],
        ["优惠", d.hasDiscount ? `- ${money(d.discountAmount)}（${d.discountTypeText}：${d.discountValueText}）` : "-RM 0.00"],
        ["最终总费用", money(d.total)]
      ];
      const csv = "\uFEFF" + rows.map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(",")).join("\n");
      downloadFile("代驾服务结算.csv", csv, "text/csv;charset=utf-8;");
    }

    function exportPDF() {
      if (!ensureCalculated()) return;
      window.print();
    }

    calcBtn.addEventListener("click", calculateFare);
    resetBtn.addEventListener("click", resetForm);
    csvBtn.addEventListener("click", exportCSV);
    pdfBtn.addEventListener("click", exportPDF);
  </script>
</body>
</html>
